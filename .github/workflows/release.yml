name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          IFS=. read -r a b c d <<< "$tag"
          echo "ver=${a:-0}.${b:-0}.${c:-0}.${d:-0}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build Lantern/Lantern.csproj -c Release -p:Version=${{ steps.v.outputs.ver }} -p:AssemblyVersion=${{ steps.v.outputs.ver }} -p:FileVersion=${{ steps.v.outputs.ver }}

      - name: Package
        id: pkg
        run: |
          zip="lantern_${{ steps.v.outputs.ver }}.zip"
          (cd Lantern/bin/Release/net10.0 && zip -j "$GITHUB_WORKSPACE/$zip" Lantern.dll)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Servers and the app download from dist/ on main, so a GitHub Releases outage must not block a build.
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" --title "$GITHUB_REF_NAME" --notes "Build ${{ steps.v.outputs.ver }}"

      - name: Update manifest
        env:
          VER: ${{ steps.v.outputs.ver }}
          MD5: ${{ steps.pkg.outputs.md5 }}
          # served from raw.githubusercontent.com, which servers reach even when GitHub's release-asset host is blocked
          URL: https://raw.githubusercontent.com/${{ github.repository }}/main/dist/${{ steps.pkg.outputs.zip }}
        run: |
          git fetch origin main
          git checkout main
          mkdir -p dist
          cp "${{ steps.pkg.outputs.zip }}" dist/
          git add -f dist/"${{ steps.pkg.outputs.zip }}"
          python3 - <<'PY'
          import json, os, datetime
          m = json.load(open('manifest.json'))
          p = m[0]
          p['versions'] = [v for v in p['versions'] if v['version'] != os.environ['VER']]
          p['versions'].insert(0, {
              'version': os.environ['VER'],
              'changelog': 'Build ' + os.environ['VER'],
              'targetAbi': '12.1.0.0',
              'sourceUrl': os.environ['URL'],
              'checksum': os.environ['MD5'],
              'timestamp': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
          })
          json.dump(m, open('manifest.json', 'w'), indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: ${{ steps.v.outputs.ver }}"
          git push origin main

  # Android app (phones and Android TV) built from the same index.html and attached to the release.
  android:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key
        env:
          KS: ${{ secrets.LANTERN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/lantern-release.jks"
            echo "LANTERN_KEYSTORE=$RUNNER_TEMP/lantern-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          LANTERN_VERSION: ${{ github.ref_name }}
          LANTERN_KEYSTORE_PASSWORD: ${{ secrets.LANTERN_KEYSTORE_PASSWORD }}
          LANTERN_KEY_ALIAS: ${{ secrets.LANTERN_KEY_ALIAS }}
          LANTERN_KEY_PASSWORD: ${{ secrets.LANTERN_KEY_PASSWORD }}
        run: |
          export LANTERN_VERSION="${LANTERN_VERSION#v}"
          if [ -n "$LANTERN_KEYSTORE" ]; then
            gradle -p android assembleRelease
            cp android/app/build/outputs/apk/release/app-release.apk "lantern-${LANTERN_VERSION}.apk"
          else
            echo "::warning::No signing key secrets set; publishing a debug-signed APK (updates will need an uninstall)."
            gradle -p android assembleDebug
            cp android/app/build/outputs/apk/debug/app-debug.apk "lantern-${LANTERN_VERSION}.apk"
          fi

      - name: Attach to release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" lantern-*.apk --clobber

      # A fixed link on raw.githubusercontent.com, which works on networks that block GitHub's release downloads.
      - name: Publish dist/lantern.apk
        run: |
          apk=$(ls lantern-*.apk)
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p dist
          cp "$apk" dist/lantern.apk
          git add -f dist/lantern.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "app: ${apk}" && git push origin main || echo "nothing to commit"
